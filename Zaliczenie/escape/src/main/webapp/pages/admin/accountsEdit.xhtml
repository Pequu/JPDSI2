<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

    <f:metadata>
        <f:viewAction action="#{accountsEditBB.onLoad()}" />
    </f:metadata>

    <ui:composition template="/templates/main-template.xhtml">

        <ui:define name="content">

        <p:panel toggleable="true" header="Edycja rekordu">

            <h:form rendered="#{accountsEditBB.accounts != null}">
                <h:panelGrid columns="3" cellpadding="5">

                    <h:outputLabel for="a-name" value="#{txtMain.firstName}:" />
                    <p:inputText id="a-name" value="#{accountsEditBB.accounts.accName}"
                                 required="true" requiredMessage="#{txtErr.requiredMessage}"
                                 validatorMessage="#{txtErr.maxNumbersMessage}">
                        <f:validateLength maximum="40" />
                    </p:inputText>
                    <p:message for="a-name" display="icon"/>

                    <h:outputLabel for="a-surname" value="#{txtMain.surName}:" />
                    <p:inputText id="a-surname" value="#{accountsEditBB.accounts.accSurname}"
                                 required="true" requiredMessage="#{txtMain.requiredMessage}"
                                 validatorMessage="#{txtErr.maxNumbersMessage}">
                        <f:validateLength maximum="40" />
                    </p:inputText>
                    <p:message for="a-surname" display="icon"/>

                    <h:outputLabel for="a-date" value="#{txtMain.birthdate}:" />
                    <p:datePicker id="a-date" value="#{accountsEditBB.accounts.accBirthDate}" maxdate="#{calendarView.maxDate}" readonlyInput="true" required="true" requiredMessage="Musisz podać datę!" />
                    <p:message for="a-date" display="icon"/>
                    
                    <h:outputLabel for="a-typ" value="Typ konta:"/>
                    <p:selectOneMenu id="a-type"
                                    value="#{accountsEditBB.selectedRoleId}"
                                    required="true"
                                    requiredMessage="#{txtErr.requiredMessage}">
                       <f:selectItems value="#{accountsEditBB.rolesList}" 
                                      var="r" 
                                      itemLabel="#{r.roleName}" 
                                      itemValue="#{r.idRole}" />
                    </p:selectOneMenu>
                    <p:message for="a-type" display="icon"/>

                </h:panelGrid>

                <p:messages id="msgs" />

                <p:commandButton value="#{txtMain.buttonSave}" action="#{accountsEditBB.saveData()}"
                                 style="margin-right: 1em;" update="@form" />

                <p:button value="#{txtMain.buttonCancel}" outcome="accountsList" />
            </h:form>

        </p:panel>

        </ui:define>
    </ui:composition>
</html>
