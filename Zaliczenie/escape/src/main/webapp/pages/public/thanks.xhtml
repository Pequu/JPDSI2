<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:p="http://primefaces.org/ui"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core">      
    
    <ui:composition template="/templates/main-template.xhtml">
        
        <f:metadata>
            <f:viewAction action="#{thanksBB.onLoad}" />
        </f:metadata>

        <ui:define name="content">
            <section class="light first just-center" >
                <div style="text-align:center;">
                    <h:graphicImage library="template" name="img/baner.jpg" alt="baner" style="height: 25rem;"/>
                </div>
                <h2 class="alt bottom-space">Dziękujemy za rezerwację #{thanksBB.name}!</h2>
                <h3 class="alt bottom-space">Cena: #{thanksBB.price}zł</h3>
                <h3 class="alt bottom-space"> Data:
                    <h:outputText value="#{thanksBB.date}">
                        <f:convertDateTime pattern="dd-MM-yyyy" />
                    </h:outputText>
                </h3>
            </section>
            
        </ui:define>

    </ui:composition>
</html>
