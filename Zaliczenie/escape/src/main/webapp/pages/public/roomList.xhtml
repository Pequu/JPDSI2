<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:p="http://primefaces.org/ui"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:composition template="/templates/main-template.xhtml">

        <ui:define name="content">
            <section class="light first">
               
                <div style="justify-items: center">
                    <div style="text-align:center;">
                        <h:graphicImage library="template" name="img/baner.jpg" alt="baner" style="height: 25rem;"/>
                    </div>
                    <h2>Lista naszych aktualnych Escape Room'ów</h2>
                </div>

            <p:messages />

            <h:form id="form-table" style="margin-bottom:1em;" styleClass="top-space just-center">

                <p:dataTable value="#{roomsListBB.list}" var="r" style="font-size: 1.2rem; width:60%">

                    <p:column>
                        <f:facet name="header">
                            <h:outputText value="Obraz:" />
                        </f:facet>
                        <h:graphicImage library="template" name="img/#{r.roomCover}.jfif" style="height: 15rem;"/>
                    </p:column>
                    
                    <p:column responsivePriority="5">
                        <f:facet name="header">
                            <h:outputText value="Nazwa pokoju" />
                        </f:facet>
                        <h:outputText value="#{r.roomName}" />
                    </p:column>

                    <p:column>
                        <f:facet name="header">
                            <h:outputText value="Opis pokoju" />
                        </f:facet>
                        <h:outputText value="#{r.roomDescription}" />
                    </p:column>

                    <p:column>
                        <f:facet name="header">
                            <h:outputText value="Cena:" />
                        </f:facet>
                        <h:outputText value="#{r.roomPrice} zł" />
                    </p:column>

                    <p:column>
                        <f:facet name="header">
                            <h:outputText value="#{txtMain.options}" />
                        </f:facet>

                        <p:commandButton value="Zarezerwuj" style="margin-right: 0.5em; padding: 2rem; z-index: 2;"
                                     action="#{roomsListBB.reserveRoom(r)}"/>


                    </p:column>

                </p:dataTable>
            </h:form>
                
            </section>
                     
        </ui:define>

    </ui:composition>
</html>
