<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:p="primefaces">

    <style>
        .ui-panelgrid.showcase-text-align-center .ui-grid-responsive .ui-panelgrid-cell {
            text-align: left;
        }
        .ui-g{
            width: 7rem;
        }
    </style>
    

        <p:panelGrid columns="2">
            <h:graphicImage library="template" name="img/logo.jpg" alt="logo" style="height: 2rem;"/>
            <ui:insert name="title">The Escapists</ui:insert>
        </p:panelGrid>
    
        <h:form style="text-align: right; position: fixed; right: 1rem; top: 2rem;">

            <!-- NIEZALOGOWANY -->
            <h:commandButton
                value="Zaloguj"
                action="#{loginBB.goToLogin}"
                rendered="#{empty remoteClient.details}" styleClass="fancyButton" />

            <!-- ZALOGOWANY -->
            <h:panelGroup rendered="#{not empty remoteClient.details}">
                <h:outputText
                    value="Zalogowany: #{remoteClient.details.accName} "
                    style="margin-right: .5rem;" />

                <h:commandButton
                    value="Wyloguj"
                    action="#{loginBB.doLogout}" styleClass="fancyButton" />
            </h:panelGroup>

        </h:form>



    
</ui:composition>
