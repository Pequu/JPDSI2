<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

    <f:metadata>
        <f:viewAction action="#{accountsEditBB.onLoad()}" />
    </f:metadata>

    <h:head>
        <meta charset="utf-8"/>
        <title>JSF 07 </title>
    </h:head>

    <h:body style="background-color: #eee; margin: 0.5em;">

        <p:panel toggleable="true" header="Edycja rekordu">

            <h:form rendered="#{accountsEditBB.accounts != null}">
                <h:panelGrid columns="3" cellpadding="5">

                    <h:outputLabel for="a-name" value="imię:" />
                    <p:inputText id="a-name" value="#{accountsEditBB.accounts.accName}"
                                 required="true" requiredMessage="Podaj imię"
                                 validatorMessage="co najwyżej 40 znaków">
                        <f:validateLength maximum="40" />
                    </p:inputText>
                    <p:message for="a-name" display="icon"/>

                    <h:outputLabel for="a-surname" value="nazwisko:" />
                    <p:inputText id="a-surname" value="#{accountsEditBB.accounts.accSurname}"
                                 required="true" requiredMessage="podaj nazwisko"
                                 validatorMessage="co najwyżej 40 znaków">
                        <f:validateLength maximum="40" />
                    </p:inputText>
                    <p:message for="a-surname" display="icon"/>

                    <h:outputLabel for="a-date" value="data ur.:" />
                    <p:inputText id="a-date" value="#{accountsEditBB.accounts.accBirthDate}"
                                 required="true" requiredMessage="podaj datę urodzenia"
                                 converterMessage="niepoprawny format daty (np. 15-07-2018)">
                        <f:convertDateTime pattern="dd-MM-yyyy"/>
                    </p:inputText>
                    <p:message for="a-date" display="icon"/>
                </h:panelGrid>

                <p:messages id="msgs" />

                <p:commandButton value="Zapisz" action="#{accountsEditBB.saveData()}"
                                 style="margin-right: 1em;" update="@form" />

                <p:button value="Anuluj" outcome="accountsList" />
            </h:form>

        </p:panel>

    </h:body>

</html>
