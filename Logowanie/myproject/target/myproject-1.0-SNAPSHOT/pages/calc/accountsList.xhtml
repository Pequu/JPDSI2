<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:p="http://primefaces.org/ui"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
	<title>MR jsf - 7</title>
</h:head>
    <h:body style="background-color: #eee; margin: 0.5em;">

        <p:panel header="Opcje wyszukiwania" toggleable="true" collapsed="true"
                 style="margin-bottom: 1em;">
            <h:form>
                <h:panelGrid columns="2" cellpadding="5">
                    <h:outputLabel value="nazwisko:" />
                    <p:inputText value="#{AccountsListBB.accSurname}" />
                    <p:commandButton value="Szukaj" update="form-table" />
                </h:panelGrid>
            </h:form>
        </p:panel>

        <p:messages />

        <h:form id="form-table" style="margin-bottom:1em;">

            <p:dataTable value="#{accountsListBB.list}" var="a">

                <p:column responsivePriority="5">
                    <f:facet name="header">
                        <h:outputText value="imię" />
                    </f:facet>
                    <h:outputText value="#{a.accName}" />
                </p:column>

                <p:column>
                    <f:facet name="header">
                        <h:outputText value="nazwisko" />
                    </f:facet>
                    <h:outputText value="#{a.accSurname}" />
                </p:column>
                
                <p:column>
                    <f:facet name="header">
                        <h:outputText value="Login" />
                    </f:facet>
                    <h:outputText value="#{a.accLogin}" />
                </p:column>
                
                <p:column>
                    <f:facet name="header">
                        <h:outputText value="Data Urodzenia" />
                    </f:facet>
                    <h:outputText value="#{a.accBirthDate}" />
                </p:column>
                
                
                <p:column>
                    <f:facet name="header">
                        <h:outputText value="opcje" />
                    </f:facet>

                    <p:commandButton value="Edytuj" style="margin-right: 0.5em"
                                     action="#{accountsListBB.editAccounts(a)}"/>

                    <p:commandButton value="Usuń" style="margin-right: 0.5em"
                                     action="#{accountsListBB.deleteAccounts(a)}"
                                     update="@form" />

                    <p:button outcome="accountsEditGET" value="Edytuj (GET)">
                        <f:param name="p" value="#{a.idAccount}" />
                    </p:button>
                </p:column>

            </p:dataTable>
        </h:form>

    </h:body>
</html>
